services:
  db:
    image: postgres:17-alpine
    container_name: softro-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: softro
      POSTGRES_PASSWORD: softro_dev_password
      POSTGRES_DB: softro_crm
    ports:
      - "5432:5432"
    volumes:
      - softro_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softro -d softro_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  softro_crm_data:
