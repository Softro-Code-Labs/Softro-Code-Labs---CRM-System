# Nightly encrypted database backup, kept for 30 days as a GitHub artifact.
# This is a second copy on top of Neon's own restore history.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  Neon *direct* connection string for production (the host WITHOUT "-pooler"),
#                        ideally for a read-only role.
#   BACKUP_PASSPHRASE    Long random passphrase. Store it in the company password manager:
#                        without it the backups can't be opened.
# Optional repository variable: PG_MAJOR (default 17), matching your Neon Postgres version.
#
# Restore steps are in README → "Backups and restore".
name: Database backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 Sri Lanka time, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
    steps:
      - name: Check secrets are set
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets first."
            exit 1
          fi

      - name: Install PostgreSQL ${{ env.PG_MAJOR }} client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Colombo date +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --format=custom --no-owner --no-acl --compress=9 \
            --dbname="$BACKUP_DATABASE_URL" --file=crm.dump
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_restore" --list crm.dump > /dev/null   # sanity check: the dump is readable
          echo "Tables: $("/usr/lib/postgresql/${PG_MAJOR}/bin/pg_restore" --list crm.dump | grep -c 'TABLE DATA')"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 0 \
            --output "softro-crm_${STAMP}.dump.gpg" crm.dump <<< "$BACKUP_PASSPHRASE"
          shred -u crm.dump
          ls -lh "softro-crm_${STAMP}.dump.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: softro-crm-backup-${{ env.STAMP }}
          path: softro-crm_*.dump.gpg
          retention-days: 30
          compression-level: 0
